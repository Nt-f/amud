    - family: MiriamCLM
      fonts:
        - asset: assets/fonts/MiriamCLM-Book.otf
        - asset: assets/fonts/MiriamCLM-Bold.otf
          weight: 700
    - family: MiriamMonoCLM
      fonts:
        - asset: assets/fonts/MiriamMonoCLM-Book.ttf
