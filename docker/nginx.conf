server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects (/app → /app/), so they work behind a proxy on
    # another port or host.
    absolute_redirect off;
    include /etc/nginx/mime.types;
    # .mjs (the Wasm build's JavaScript glue) is imported as a module, which
    # browsers refuse unless it's served as JavaScript; nginx doesn't map it.
    types { application/manifest+json webmanifest; application/javascript mjs; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    # tool/build_web.sh precompresses the compiled app and renderers.
    gzip_static on;

    # The landing page, entry points and service workers must always be
    # revalidated so visitors and installed PWAs pick up new deployments.
    # /sw.js at the root only retires the worker of the app's old home there.
    location ~* ^/(app/)?(index\.html|sw\.js|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # All Sefaria sources are baked into the image and also exposed as a
    # plain static API: /sefaria/manifest.json and /sefaria/<file>.json.gz
    # (gzip-compressed JSON, same files the app bundles).
    location ^~ /sefaria/ {
        alias /usr/share/nginx/html/app/assets/assets/sefaria/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
        autoindex on;
    }

    # Flutter's build output isn't content-hashed (main.dart.js keeps its
    # name across builds), so a long max-age lets CDNs like Cloudflare serve
    # the old app for days. Make caches revalidate instead: unchanged files
    # still come back as a cheap 304 via ETag, and the service worker keeps
    # the app available offline regardless.
    location ~* \.(?:m?js|wasm|ttf|otf|woff2?|png|jpg|svg|gz|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Optional push sidecar. Resolve on request so the base app can run
    # without the compose push profile enabled.
    location ^~ /app/api/push/ {
        resolver 127.0.0.11 valid=30s;
        set $push_backend push:8080;
        rewrite ^/app/api/push/(.*)$ /$1 break;
        proxy_pass http://$push_backend;
        # Overwrite browser-supplied values; the sidecar trusts this peer only.
        proxy_set_header X-Amud-Client-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 128k;
        add_header Cache-Control "no-store";
    }

    # The web app. Hash routing (#/zmanim) is used, but fall back to its
    # shell anyway.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # The web app used to live at the root; its deep links (/#/zmanim) are
    # redirected by the landing page's script, since the hash never reaches
    # the server.
    location / {
        try_files $uri $uri/ =404;
    }
}
