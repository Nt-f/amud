<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Offline interactive siddur with all Sefaria versions, zmanim, Hebrew calendar, daily learning and Torah texts.">
  <meta name="theme-color" content="#3B5BA5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B2233" media="(prefers-color-scheme: dark)">
  <!-- iOS / installable PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Amud">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Amud</title>
  <!-- Bundle PDF.js so printing previews work offline in the installed PWA. -->
  <script>var dartPdfJsBaseUrl = new URL("pdfjs/", document.baseURI).href;</script>
  <style>
    @font-face { font-family: Fraunces; font-weight: 600; src: url('assets/assets/fonts/Fraunces-Amud.ttf') format('truetype'); }
    html, body { margin: 0; height: 100%; background: #172a5c; }
    /* Launch animation from the Amud logo design: the podium lines fly in,
       the pages fan open, the wordmark rises, then the top lines sweep
       while the app loads. */
    #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; background: #172a5c; transition: opacity .4s ease; }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .word { font: 600 56px Fraunces, Georgia, serif; letter-spacing: -1.5px; color: #f8f3ea;
      animation: amud-rise .6s 1.75s ease-out both; }
    #splash .throw { transform-box: fill-box; transform-origin: center; animation: amud-throw .95s cubic-bezier(.18,1.35,.4,1) both; }
    #splash .pg { transform-box: fill-box; animation: amud-open .6s cubic-bezier(.2,.8,.3,1) both; }
    #splash .pg-l { transform-origin: right bottom; }
    #splash .pg-r { transform-origin: left bottom; }
    #splash .ledge { animation: amud-dim .5s 2.6s ease forwards; }
    #splash .load { stroke-dasharray: 100 100; stroke-dashoffset: 100; animation: amud-sweep 1.7s ease-in-out infinite backwards; }
    @keyframes amud-throw { 0% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--r)) scale(1.5); } 18% { opacity: 1; } 100% { opacity: 1; transform: none; } }
    @keyframes amud-open { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: none; } }
    @keyframes amud-dim { to { opacity: .3; } }
    @keyframes amud-sweep { 0% { stroke-dashoffset: 100; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }
    @keyframes amud-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #splash .throw, #splash .pg, #splash .word { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Amud is loading">
    <svg width="240" height="240" viewBox="16 20 168 168" aria-hidden="true">
      <g transform="rotate(-14 97 92)"><path class="pg pg-l" style="animation-delay:1.2s" fill="#6f8cc0" d="M97 92 C84 80 62 75 44 76 L40 30 C62 29 84 36 97 50 Z"/></g>
      <g transform="rotate(14 103 92)"><path class="pg pg-r" style="animation-delay:1.2s" fill="#6f8cc0" d="M103 92 C116 80 138 75 156 76 L160 30 C138 29 116 36 103 50 Z"/></g>
      <g transform="rotate(-7 97 92)"><path class="pg pg-l" style="animation-delay:1.08s" fill="#a9c0ee" d="M97 92 C84 80 62 75 44 76 L40 30 C62 29 84 36 97 50 Z"/></g>
      <g transform="rotate(7 103 92)"><path class="pg pg-r" style="animation-delay:1.08s" fill="#a9c0ee" d="M103 92 C116 80 138 75 156 76 L160 30 C138 29 116 36 103 50 Z"/></g>
      <path class="pg pg-l" style="animation-delay:.95s" fill="#f8f3ea" d="M97 92 C84 80 62 75 44 76 L40 30 C62 29 84 36 97 50 Z"/>
      <path class="pg pg-r" style="animation-delay:.95s" fill="#f8f3ea" d="M103 92 C116 80 138 75 156 76 L160 30 C138 29 116 36 103 50 Z"/>
      <g stroke="#f8f3ea" stroke-width="7" stroke-linecap="round" fill="none">
        <g class="throw" style="--tx:-160px;--ty:-130px;--r:-80deg;animation-delay:0s"><line class="ledge" x1="50" y1="106" x2="150" y2="106"/></g>
        <g class="throw" style="--tx:150px;--ty:-150px;--r:65deg;animation-delay:.08s"><line class="ledge" x1="64" y1="119" x2="136" y2="119"/></g>
        <g class="throw" style="--tx:-170px;--ty:90px;--r:120deg;animation-delay:.16s"><line x1="82" y1="133" x2="82" y2="172"/></g>
        <g class="throw" style="--tx:20px;--ty:210px;--r:-150deg;animation-delay:.24s"><line x1="100" y1="133" x2="100" y2="180"/></g>
        <g class="throw" style="--tx:170px;--ty:110px;--r:95deg;animation-delay:.32s"><line x1="118" y1="133" x2="118" y2="172"/></g>
      </g>
      <g stroke="#f8f3ea" stroke-width="7" stroke-linecap="round" fill="none">
        <line class="load" pathLength="100" style="animation-delay:2.6s" x1="50" y1="106" x2="150" y2="106"/>
        <line class="load" pathLength="100" style="animation-delay:2.85s" x1="64" y1="119" x2="136" y2="119"/>
      </g>
    </svg>
    <div class="word">amud</div>
  </div>
  <script>var splashStart = performance.now();</script>
  <script>
    // Analytics (Firebase, started by the app): a cookie that ends with the
    // browser session, so visits aren't linked to each other, and no Google
    // signals or ad personalization. Firebase picks up this gtag queue.
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('set', { cookie_expires: 0, allow_google_signals: false, allow_ad_personalization_signals: false });
  </script>
  <script>
    // Offline-first PWA: tool/gen_service_worker.dart generates sw.js,
    // which precaches the whole app including every Sefaria text.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW registration failed', e); });
      });
      // A new deployment's worker takes over as soon as it has cached
      // everything; reload once so the page runs the new version instead of
      // the cached one it started with. (Skipped on the very first install,
      // and at most once a minute so a misbehaving worker can't loop.)
      var hadController = !!navigator.serviceWorker.controller, reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || reloading) return;
        try {
          var last = +sessionStorage.getItem('sw-reload') || 0;
          if (Date.now() - last < 60000) return;
          sessionStorage.setItem('sw-reload', String(Date.now()));
        } catch (e) {}
        reloading = true;
        window.location.reload();
      });
    }
    // The app's first frame can come before the intro has finished (from
    // the cache it takes about a second), so the splash stays up, over the
    // app, until the wordmark has risen, then fades out. A tap anywhere
    // skips the rest of the intro: the splash fades as soon as the app is
    // ready (straight away if it already is).
    (function () {
      var ready = false, skipped = false, hiding = false;
      function hide() {
        var s = document.getElementById('splash');
        if (!s || hiding) return;
        hiding = true;
        s.classList.add('done');
        setTimeout(function () { s.remove(); }, 450);
      }
      document.getElementById('splash').addEventListener('pointerdown', function () {
        skipped = true;
        if (ready) hide();
      });
      window.addEventListener('flutter-first-frame', function () {
        ready = true;
        if (skipped) return hide();
        var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(hide, Math.max(0, (still ? 1200 : 2600) - (performance.now() - splashStart)));
      });
    })();
  </script>
  <script src="integrations.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
