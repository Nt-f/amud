name: Apple

# Builds macOS and iOS (unsigned) apart from the main Build workflow, so the
# release never waits on them. When a tag's build succeeds, its file is
# added to that tag's GitHub Release (created by build.yml).
#
# Both of those builds are unsigned: macOS asks to confirm the first launch
# (right-click → Open), and the .ipa must be signed by a sideloading tool
# (AltStore, Sideloadly) before it installs. The appstore job builds a
# signed iOS app and uploads it to TestFlight.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: 3.41.2

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      number: ${{ steps.v.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The build number counts commits: it only goes up, whichever
      # workflow built the version.
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
          fi
          echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      # ditto keeps the .app bundle's symlinks and permissions intact.
      - run: ditto -c -k --keepParent "$(ls -d build/macos/Build/Products/Release/*.app | head -1)" amud-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: amud-macos
          path: amud-macos.zip
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/upload_to_release.sh amud-macos.zip
    permissions:
      contents: write

  # Signs the iOS app (with the watch app and widgets inside it) and uploads
  # it to App Store Connect, where it shows up in TestFlight. There is no
  # certificate or profile in the repo: the API key lets Xcode create a
  # cloud-managed distribution certificate and the profiles itself, so the
  # key needs the Admin role. Repository secrets:
  #   ASC_KEY_ID, ASC_ISSUER_ID  from App Store Connect → Integrations
  #   ASC_KEY_P8                 base64 of the AuthKey_….p8 file
  #   APPLE_TEAM_ID              from developer.apple.com → Membership
  # App Store Connect refuses a build number it has already seen, so
  # running this twice on the same commit fails the second upload.
  appstore:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Writes Generated.xcconfig (the version every target reads) and runs
      # pod install, without building. --no-codesign skips Flutter's check
      # for a certificate on the runner: there is none until Archive has
      # Xcode create one.
      - run: flutter build ios --release --config-only --no-codesign --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: echo "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
      # ExportOptions.plist says "upload", so this sends the build to App
      # Store Connect instead of writing an .ipa.
      - name: Upload
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  ios:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-name=${{ needs.version.outputs.name }} --build-number=${{ needs.version.outputs.number }}
      # An .ipa is the .app inside a Payload/ folder, zipped.
      - run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr amud-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: amud-ios
          path: amud-ios-unsigned.ipa
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/upload_to_release.sh amud-ios-unsigned.ipa
    permissions:
      contents: write
