name: siddur_engine
description: >-
  Platform-independent siddur engine: loads Sefaria-format siddur texts,
  classifies rubrics/instructions, evaluates conditional (seasonal/holiday)
  sections against a Hebrew-calendar day context, and produces a render list.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.5.0
dependencies:
  hebcal:
    path: ../hebcal
dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
