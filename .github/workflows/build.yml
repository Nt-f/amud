name: Build

# Windows builds need a Windows host (Flutter can't cross-compile from
# Linux), so both apps are built here.
#
# Pushing a tag like `v0.2.0` builds that version and publishes a GitHub
# Release; the apps' update checker (lib/features/update) looks for the
# newest release and its `siddur-android.apk` / `siddur-windows.zip`.
# Running the workflow by hand just builds the files as artifacts.
#
# Android signing uses these repository secrets (the same key as local
# release builds, or Android won't install one over the other):
#   SIDDUR_KEYSTORE_BASE64  base64 of the .jks file
#   SIDDUR_KEYSTORE_PASSWORD, SIDDUR_KEY_ALIAS, SIDDUR_KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: 3.41.2

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
      # The exe needs the DLLs and data/ folder beside it, so ship the
      # whole Release directory.
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath siddur-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: siddur-windows
          path: siddur-windows.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's dependency and wrapper downloads are most of a cold build.
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.SIDDUR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIDDUR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::SIDDUR_KEYSTORE_BASE64 is not set; a release APK must be signed with the release key."
            exit 1
          fi
      - run: flutter pub get
      # Phones only: skipping x86_64 (emulators, a few Chromebooks) saves
      # one of the three AOT compiles and ~20 MB of APK.
      - run: flutter build apk --release --target-platform android-arm,android-arm64 --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
        env:
          SIDDUR_KEYSTORE_PASSWORD: ${{ secrets.SIDDUR_KEYSTORE_PASSWORD }}
          SIDDUR_KEY_ALIAS: ${{ secrets.SIDDUR_KEY_ALIAS }}
          SIDDUR_KEY_PASSWORD: ${{ secrets.SIDDUR_KEY_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk siddur-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: siddur-android
          path: siddur-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Siddur ${{ needs.version.outputs.name }}
          generate_release_notes: true
          files: |
            siddur-android.apk
            siddur-windows.zip
