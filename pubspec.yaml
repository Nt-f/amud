name: amud
description: "Offline, interactive siddur with Sefaria texts, a full Hebcal port, zmanim, notifications and a customizable home screen."
publish_to: 'none'
version: 0.9.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hebcal:
    path: packages/hebcal
  siddur_engine:
    path: packages/siddur_engine
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.3.4
  archive: ">=4.0.0 <4.1.0"
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  flutter_local_notifications: ^18.0.1
  geolocator: ^14.1.1
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  flutter_js: ^0.8.7
  web: ^1.1.1
  intl: ^0.20.2
  http: ^1.6.0
  crypto: ^3.0.6
  package_info_plus: ^10.2.1
  scrollable_positioned_list: ^0.3.8
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  wakelock_plus: ^1.7.0
  quick_actions: ^1.1.1
  app_links: ^7.0.0
  home_widget: ^0.10.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  path_provider: ^2.1.6
  sherpa_onnx: ^1.13.8
  record: ^6.2.1
  pdf: ^3.12.0
  printing: ^5.14.0
  in_app_update: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sefaria/
    - assets/corpus/
    - assets/integrations/
    - assets/voice/
    - assets/rules/
    - assets/fonts/
    - assets/tehillim/
  fonts:
    # Only "amud" (the wordmark in the launch animation).
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Amud.ttf
          weight: 600
    - family: FrankRuhlLibre
      fonts:
        - asset: assets/fonts/FrankRuhlLibre.ttf
    - family: NotoSerifHebrew
      fonts:
        - asset: assets/fonts/NotoSerifHebrew.ttf
    # Rashi script, for Rashi's commentary in Shnayim Mikra.
    - family: NotoRashiHebrew
      fonts:
        - asset: assets/fonts/NotoRashiHebrew-Regular.ttf
        - asset: assets/fonts/NotoRashiHebrew-Bold.ttf
          weight: 700
    - family: DavidLibre
      fonts:
        - asset: assets/fonts/DavidLibre-Regular.ttf
        - asset: assets/fonts/DavidLibre-Bold.ttf
          weight: 700
    - family: TaameyFrankCLM
      fonts:
        - asset: assets/fonts/TaameyFrankCLM-Medium.ttf
        - asset: assets/fonts/TaameyFrankCLM-Bold.ttf
          weight: 700
    - family: TaameyDavidCLM
      fonts:
        - asset: assets/fonts/TaameyDavidCLM-Medium.ttf
        - asset: assets/fonts/TaameyDavidCLM-Bold.ttf
          weight: 700
    - family: TaameyAshkenaz
      fonts:
        - asset: assets/fonts/TaameyAshkenaz-Medium.ttf
        - asset: assets/fonts/TaameyAshkenaz-Bold.ttf
          weight: 700
    - family: KeterYG
      fonts:
        - asset: assets/fonts/KeterYG-Medium.ttf
        - asset: assets/fonts/KeterYG-Bold.ttf
          weight: 700
    - family: KeterAramTsova
      fonts:
        - asset: assets/fonts/KeterAramTsova.ttf
    - family: EzraSIL
      fonts:
        - asset: assets/fonts/EzraSIL.ttf
    - family: EzraSILSR
      fonts:
        - asset: assets/fonts/EzraSILSR.ttf
    - family: FrankRuehlCLM
      fonts:
        - asset: assets/fonts/FrankRuehlCLM-Medium.otf
        - asset: assets/fonts/FrankRuehlCLM-Bold.otf
          weight: 700
    - family: DavidCLM
      fonts:
        - asset: assets/fonts/DavidCLM-Medium.otf
        - asset: assets/fonts/DavidCLM-Bold.otf
          weight: 700
    - family: DrugulinCLM
      fonts:
