name: Build

# Windows builds need a Windows host (Flutter can't cross-compile from
# Linux), so the Windows app is built here. Run manually from the Actions
# tab, or on a pushed tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      # The exe needs the DLLs and data/ folder beside it, so ship the
      # whole Release directory.
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath siddur-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: siddur-windows
          path: siddur-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: siddur-android
          path: build/app/outputs/flutter-apk/app-release.apk
