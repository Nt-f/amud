name: Build

# Builds every platform: Android, Windows, Linux, macOS, iOS (unsigned) and
# the web app. Windows and Apple builds need their own hosts (Flutter can't
# cross-compile), so each platform is its own job.
#
# Pushing a tag like `v0.4.0` builds that version and publishes a GitHub
# Release; the apps' update checker (lib/features/update) looks for the
# newest release and picks its file by name: the `.apk` on Android, the
# file with `windows` / `linux` in its name on desktop.
# Running the workflow by hand just builds the files as artifacts.
#
# Android signing uses these repository secrets (the same key as local
# release builds, or Android won't install one over the other):
#   SIDDUR_KEYSTORE_BASE64  base64 of the .jks file
#   SIDDUR_KEYSTORE_PASSWORD, SIDDUR_KEY_ALIAS, SIDDUR_KEY_PASSWORD
#
# The macOS and iOS builds are unsigned: macOS asks to confirm the first
# launch (right-click → Open), and the .ipa must be signed by a sideloading
# tool (AltStore, Sideloadly) before it installs.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: 3.41.2

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The local packages' own dev dependencies (package:test) aren't
      # fetched by the app's pub get, and `flutter analyze` checks their
      # tests too, so get them first.
      - run: |
          flutter pub get
          (cd packages/hebcal && dart pub get)
          (cd packages/siddur_engine && dart pub get)
      - run: flutter analyze
      - run: flutter test
      - run: cd packages/siddur_engine && dart test
      - run: cd packages/hebcal && dart test

  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
      # The exe needs the DLLs and data/ folder beside it, so ship the
      # whole Release directory.
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath amud-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: amud-windows
          path: amud-windows.zip

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's dependency and wrapper downloads are most of a cold build.
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.SIDDUR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIDDUR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::SIDDUR_KEYSTORE_BASE64 is not set; a release APK must be signed with the release key."
            exit 1
          fi
      - run: flutter pub get
      # Phones only: skipping x86_64 (emulators, a few Chromebooks) saves
      # one of the three AOT compiles and ~20 MB of APK.
      - run: flutter build apk --release --target-platform android-arm,android-arm64 --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
        env:
          SIDDUR_KEYSTORE_PASSWORD: ${{ secrets.SIDDUR_KEYSTORE_PASSWORD }}
          SIDDUR_KEY_ALIAS: ${{ secrets.SIDDUR_KEY_ALIAS }}
          SIDDUR_KEY_PASSWORD: ${{ secrets.SIDDUR_KEY_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk amud-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: amud-android
          path: amud-android.apk

  linux:
    needs: [version, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
      # The binary needs lib/ and data/ beside it; ship the bundle folder.
      - run: tar -czf amud-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: amud-linux
          path: amud-linux-x64.tar.gz

  macos:
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
      # ditto keeps the .app bundle's symlinks and permissions intact.
      - run: ditto -c -k --keepParent "$(ls -d build/macos/Build/Products/Release/*.app | head -1)" amud-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: amud-macos
          path: amud-macos.zip

  ios:
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
      # An .ipa is the .app inside a Payload/ folder, zipped.
      - run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr amud-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: amud-ios
          path: amud-ios-unsigned.ipa

  web:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The landing page at the site root and the app under /app/, as
      # deployed to amud.page (see DEPLOY.md).
      - run: bash tool/build_web.sh
      - run: cd web-dist && zip -qr ../amud-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: amud-web
          path: amud-web.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, android, linux, macos, ios, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The app shows these notes before and after updating. Write them in
      # release-notes/<version>.md (Markdown); without that file, the
      # commit subjects since the previous tag are used.
      - name: Release notes
        shell: bash
        run: |
          v="${{ needs.version.outputs.name }}"
          if [[ -f "release-notes/$v.md" ]]; then
            cp "release-notes/$v.md" notes.md
          else
            prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME" > notes.md
          fi
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Amud ${{ needs.version.outputs.name }}
          body_path: notes.md
          files: |
            amud-android.apk
            amud-windows.zip
            amud-linux-x64.tar.gz
            amud-macos.zip
            amud-ios-unsigned.ipa
            amud-web.zip
